spring.application.name=api-concessionaria

# ---------- Banco de dados (PostgreSQL) ----------
# Os valores após ":" são os padrões; podem ser sobrescritos pelas variáveis de ambiente
# DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/concessionaria}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate ----------
# "validate": o Hibernate só confere se a tabela do banco corresponde à entidade Carro.
# A tabela é criada pelo script database/01-schema.sql.
# (Para o Hibernate criar/alterar a tabela sozinho, troque para "update".)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
